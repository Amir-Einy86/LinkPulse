<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پروفایل | لینک‌پالس</title>
  <meta name="theme-color" content="#f5f2eb">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/Vazirmatn-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="js/animations.js"></script>
</head>
<body data-shell="app" data-page="profile" data-title="پروفایل">
  <a class="skip" href="#main">رفتن به محتوای اصلی</a>

  <main id="main" class="page">
    <div class="page-head">
      <div>
        <h1>پروفایل</h1>
        <p class="muted">اطلاعات حسابت رو اینجا می‌بینی و هر وقت خواستی عوضشون می‌کنی.</p>
      </div>
    </div>

    <div class="grid-profile">
      <!-- کارت خلاصه‌ی پروفایل -->
      <aside class="card profile-card">
        <span class="avatar avatar-lg" id="pAvatar" aria-hidden="true">ا</span>
        <h2 id="pName">—</h2>
        <p class="dim ltr" id="pUsername">@</p>
        <p class="muted profile-bio" id="pBio"></p>
        <ul class="profile-meta">
          <li><span class="icon">mail</span><span class="ltr" id="pEmail"></span></li>
          <li><span class="icon">event</span><span id="pJoined"></span></li>
        </ul>
        <div class="profile-stats">
          <div><b id="sLinks">۰</b><span>لینک</span></div>
          <div><b id="sClicks">۰</b><span>کلیک</span></div>
          <div><b id="sActive">۰</b><span>فعال</span></div>
        </div>
      </aside>

      <div class="stack">
        <!-- فرم ویرایش -->
        <section class="card">
          <div class="card-head">
            <div><h2 class="card-title"><span class="icon tone-primary">badge</span>اطلاعات شخصی</h2><p class="card-sub">این اطلاعات فقط توی همین مرورگر ذخیره می‌شه.</p></div>
          </div>
          <form id="profileForm" class="stack" novalidate>
            <div class="form-grid">
              <div class="field">
                <label class="label" for="fName">نام</label>
                <input id="fName" class="input" maxlength="40" autocomplete="name">
              </div>
              <div class="field">
                <label class="label" for="fUser">نام کاربری</label>
                <input id="fUser" class="input ltr" maxlength="20" autocomplete="username" spellcheck="false">
              </div>
            </div>
            <div class="field">
              <label class="label" for="fEmail">ایمیل</label>
              <input id="fEmail" class="input ltr" type="email" autocomplete="email" spellcheck="false">
            </div>
            <div class="field">
              <label class="label" for="fBio">درباره‌ی من <span class="opt">(اختیاری)</span></label>
              <textarea id="fBio" class="textarea" maxlength="160" placeholder="چند کلمه درباره‌ی خودت بنویس…"></textarea>
              <p class="hint"><span id="bioCount">۰</span> از ۱۶۰ کاراکتر</p>
            </div>
            <div class="row gap-2 wrap">
              <button type="submit" class="btn btn-primary" id="saveBtn"><span class="icon">save</span>ذخیره‌ی تغییرات</button>
              <button type="button" class="btn btn-ghost" id="resetForm">برگردوندن مقدارها</button>
            </div>
          </form>
        </section>

        <!-- فعالیت اخیر -->
        <section class="card">
          <div class="card-head">
            <div><h2 class="card-title"><span class="icon tone-secondary">history</span>فعالیت اخیر</h2><p class="card-sub">آخرین اتفاق‌های حسابت</p></div>
          </div>
          <ul class="timeline" id="activity"></ul>
        </section>
      </div>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/link-modal.js"></script>
  <script src="js/pages/profile.js"></script>
</body>
</html>
